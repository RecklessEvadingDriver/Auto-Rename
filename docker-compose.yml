version: '3.8'

services:
  bot:
    build: .
    container_name: auto-rename-bot
    restart: unless-stopped
    environment:
      - API_ID=${API_ID}
      - API_HASH=${API_HASH}
      - BOT_TOKEN=${BOT_TOKEN}
      - DB_URL=${DB_URL}
      - DB_NAME=${DB_NAME:-RexBots}
      - OWNER_ID=${OWNER_ID}
      - LOG_CHANNEL=${LOG_CHANNEL}
      - SUPPORT_CHAT=${SUPPORT_CHAT}
      - WEBHOOK=${WEBHOOK:-True}
      - PORT=${PORT:-8980}
      - START_PIC=${START_PIC}
      - LEADERBOARD_PIC=${LEADERBOARD_PIC}
      - FSUB_PIC=${FSUB_PIC}
      - BOT_USERNAME=${BOT_USERNAME}
      - DUMP_CHANNEL=${DUMP_CHANNEL}
    ports:
      - "${PORT:-8980}:8980"
    volumes:
      - ./downloads:/app/downloads
      - ./temp:/app/temp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8980/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
